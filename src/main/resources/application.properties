spring.application.name=payment-service-provider
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/payments_psp
spring.datasource.username=user
spring.datasource.password=userpass
spring.jpa.hibernate.ddl-auto=update

psp.base-url=http://localhost:8085
psp.session-ttl-minutes=1440
psp.kafka.authorization-topic=payment.authorization.requested

outbox.batch-size=50
outbox.poll-interval-ms=1000
outbox.send-timeout-seconds=10
outbox.claim-stale-seconds=60
outbox.purge-cron=0 0 * * * *

spring.kafka.bootstrap-servers=localhost:9093
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=psp-authorization
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=RECORD